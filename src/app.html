<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="quwa" />
		<meta name="application-name" content="quwa" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="icon" href="/favicon.png?v=2" type="image/png" />
		<link rel="apple-touch-icon" href="/favicon.png?v=2" />
		<meta
			name="description"
			content="Panduan ibadah haji offline Patuna Coklat B — jadwal, doa, dan bimbingan ritual untuk jamaah 2026."
		/>

		<!-- Open Graph / SEO tags -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Patuna Coklat-B Hajj Companion" />
		<meta property="og:title" content="Patuna Coklat-B Hajj Companion" />
		<meta
			property="og:description"
			content="Panduan ibadah haji offline Patuna Coklat B — jadwal, doa, dan bimbingan ritual untuk jamaah 2026."
		/>
		<meta property="og:image" content="https://hajj-companion.pages.dev/og-image.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:url" content="https://hajj-companion.pages.dev/" />
		<meta property="og:locale" content="id_ID" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Patuna Coklat-B Hajj Companion" />
		<meta
			name="twitter:description"
			content="Panduan ibadah haji offline Patuna Coklat B — jadwal, doa, dan bimbingan ritual untuk jamaah 2026."
		/>
		<meta name="twitter:image" content="https://hajj-companion.pages.dev/og-image.jpg" />
		<script>
			(function () {
				var t = 'auto';
				try {
					t = localStorage.getItem('patuna-theme') || 'auto';
				} catch (e) {}
				var dark = false;
				if (t === 'dark') dark = true;
				else if (t === 'auto') {
					var h = new Date().getHours();
					dark = h >= 18 || h < 4;
				}
				document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
